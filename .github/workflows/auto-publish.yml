# .github/workflows/pr-push.yml
name: CI
on:
  pull_request: {}
  push:
    branches: [gh-pages]
jobs:
  main:
    name: Build, Validate and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: w3c/spec-prod@v2
        with:
          W3C_ECHIDNA_TOKEN: ${{ secrets.W3C_TR_TOKEN }}
          W3C_WG_DECISION_URL: https://github.com/w3c/privacywg/blob/main/minutes/privacywg-20250206.md#confirming-publication-decision
          W3C_BUILD_OVERRIDE: |
             specStatus: NOTE
